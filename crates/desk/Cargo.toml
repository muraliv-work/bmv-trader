[package]
name = "desk"
version = "0.1.0"
edition = "2024"
description = "Quant Desk control plane (DESIGN §4c): roles, permissions, lifecycle, hash-chained audit, store"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
rust_decimal = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
