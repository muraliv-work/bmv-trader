[package]
name = "bmv-trader"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Any plain integer overflow panics instead of wrapping silently, also in release.
[profile.release]
overflow-checks = true

[dev-dependencies]
proptest = "1.12.0"
